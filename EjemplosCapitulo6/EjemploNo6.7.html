 <!DOCTYPE html>
 <!-- Fig. 6.7: suma.html -->
 <!-- Secuencia de comandos de suma.-->
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <title>Ejemplo 6.7: Secuencia de comandos de suma.</title>
    <script>
        var primerNumero; // primera cadena introducida por el usuario
        var segudnoNumero; // segunda cadena introducida por el usuario
        var numero1; // primer numero a sumar
        var numero2; // segundo número a sumar
        var suma; // suma de número1 y número2

        // leer el primer número del usuario como una cadena
        primerNumero = window.prompt( "Escriba el primer entero" );

        // lee el segundo número del usuario
        segundoNumero =  window.prompt ( "Escriba el segundo entero" );    

        numero1 = parseInt ( primerNumero );

        numero2 = parseInt( segundoNumero );

        suma = numero1 + numero2; // suma los números

        //Muestra los resultados
        document.writeln(" <h1> Ejemplo 6.7: Secuencia de comandos de suma.</h1>")
        document.writeln(" <h2> La suma de " + numero1 + " + " + numero2 + " = " + suma + "</h2>")

    </script>
 </head>
