<!DOCTYPE html>
<!-- Fig. 6.14: Bienvenida5.html-->
<!-- Uso de operadores de igualdad y relacionales -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <script>
        document.writeln("<h1> Ejemplo 6.14: Uso de operadores de igualdad y relacionales.</h1>")
        var nombre; // cadena introducida por el usuario
        var ahora = new Date(); // Fecha y hora actuales tomadas del sistema del equipo
        var hora = ahora.getHours(); // hora actual (0-23)

        // lee el nombre del cuadro indicador como una cadena
        nombre = window.prompt("Escriba su nombre");

        // determina si es de mañana
        if (hora < 12)
            document.write("<h1> Buenos d&iacute;as, ");

        // determina si la hora es PM
        if (hora >= 12) {
            // convierte a reloj de 12 horas
            hora = hora - 12;

            // determina si es antes de las 6 PM
            if (hora < 6)
                document.write("<h1>Buenas tardes, ");

            // determina si es después de las 6 PM
            if (hora >= 6)
                document.write("<h1> Buenas noches, ");
        } // end if

        document.writeln(nombre +
            ", bienvenido a la programaci&oacute;n en JavaScript</h1>"
        );

    </script>
    <title>Ejemplo 6.14: Uso de operadores de igualda y relacionales</title>
</head>
