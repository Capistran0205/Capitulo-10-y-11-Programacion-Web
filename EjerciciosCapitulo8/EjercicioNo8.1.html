      <meta charset="utf-8">
      <title>Ejercicio de autoevaluación 8.1</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <link rel="stylesheet" href="/Estilos/EspaciosBlanco.css">
      <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
      <script>
         // la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación
         document.writeln( "<h1>Ejercicio de Autoevaluación 8.1</h1>")
         document.writeln( "<hr>" );
         document.writeln( "<p>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>El caso default es requerido en la instrucción de selección switch.<span class = 'respuesta'> Falso. El caso default es opcional. Si no se necesita una acción predeterminada, entonces no hay necesidad de un caso default.</span></li>" );
         document.writeln( "<li>La instrucción break es requerida en el último caso de una instrucción de selección switch.<span class = 'respuesta'> Falso. La instrucción break se utiliza para salir del switch. La instrucción break no se requiere para el último caso en switch.</span></li>" );
         document.writeln( "<li>La expresión <code>(x > y && a < b)</code> es verdadera si <code>x > y</code> es verdadera y <code>a < b </code>. <span class = 'respuesta'>Falso. Ambas expresiones relacionales deben ser verdaderas para que toda la expresión sea verdadera cuando se utilice el operador &&</span></li>" );
         document.writeln( "<li>Una expresión que contiene el operador || es verdadera si uno o ambos de sus operandos son verdaderos.</li>" );
         document.writeln( "</ol>" );
      </script>
   </head>
