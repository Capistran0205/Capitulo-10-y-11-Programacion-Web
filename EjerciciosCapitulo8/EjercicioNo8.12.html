<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <title>Ejercicio 8.12: ¿Qué imprime cada una de las líneas instrucciones?</title>
    <script>
        document.writeln("<h1>Ejercicio 8.12: ¿Qué imprime cada una de las líneas instrucciones?</h1>");
        document.writeln("<p>Suponga que i = 1, j = 2, k = 3 y m = 2. ¿Qué es lo que imprime cada una de las siguientes instrucciones? Son necesarios los paréntesis en cada caso?.</p>");
        document.writeln("<ol type = 'a'>");
        document.writeln("<li><code>document.writeln( i == 1 );</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>true</code>");
        document.writeln("<li><code>document.writeln( j == 3 );</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>false</code>");
        document.writeln("<li><code>document.writeln( i >= 1 && j < 4 );</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>false</code>");
        document.writeln("<li><code>document.writeln( m <= 99 && k < m );</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>true</code>");
        document.writeln("<li><code>document.writeln( j >= i || k == m );</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>false</code>");
        document.writeln("<li><code>document.writeln( k + m < j || 3 - j >= k );</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>false</code>");
        document.writeln("<li><code>document.writeln( !( k > m ));</code></li>");
        document.writeln("<h2>Solución:</h2>");
        document.writeln("<code>false</code>");
        document.writeln("</ol>");
    </script>
</head>
