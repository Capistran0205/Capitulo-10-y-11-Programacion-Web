<!DOCTYPE html>

<!-- Fig. 8.2: ContadorFor.html -->
<!-- Repetición controlada por contador con la instrucción for. -->
<html>
<head>
   <meta charset="utf-8">
   <title>Ejemplo 8.2: Repetición controlada por contador</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <script>
      document.writeln("<h1>Ejemplo 8.2: Repetición controlada por contador.</h1>");
      // La inicialización, condición de repetición e
      // incremento se incluyen en el encabezado de
      // la instrucción for.
      for ( var contador = 1; contador <= 7; ++contador )
         document.writeln( "<p style = 'font-size: " +
            contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );

   </script>
</head>

        <a class ="boton" href="EjemploNo8.5.html">Siguiente&rarr;</a>
    </nav>
</body>
</html>
