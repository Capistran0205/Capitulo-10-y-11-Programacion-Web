<!DOCTYPE html>

<!-- Fig. 8.1: ContadorWhile.html -->
<!-- Repetición controlada por un contador. -->
<html>

<head>
    <meta charset="utf-8">
    <title>Ejemplo 8.1: Repetición controlada por contador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <script>
        document.writeln("<h1>Ejemplo 8.1: Repetición controlada por contador.</h1>");
        var contador = 1; // inicialización

        while (contador <= 7) // condición de repetición
        {
            document.writeln("<p style = 'font-size: " +
                contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>"); // Incrementa el tamaño de la fuente en cada iteracción
            ++contador; // incremento
        } // fin de while

    </script>
</head>

        <a class="boton" href="EjemploNo8.2.html">Siguiente&rarr;</a>
    </nav>
</body>

</html>
