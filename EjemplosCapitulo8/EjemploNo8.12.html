 <!DOCTYPE html>

<!-- Fig. 8.12: PruebaContinue.html -->
<!-- Uso de la instrucción continue en una instrucción for. -->
<html>
<head>
   <meta charset="utf-8">
   <title>Ejemplo 8.12: Uso de la instrucción continue en una instrucción for</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <script>
      document.writeln("<h1>Ejemplo 8.12: Uso de la instrucción continue en una instrucción for</h1>");
      for ( var cuenta = 1; cuenta <= 10; ++cuenta )
      {
         if ( cuenta == 5 )
            continue; // omite el resto del código del ciclo sólo si cuenta == 5

         document.writeln( cuenta + " " );
      } // fin de for

      document.writeln( "<p>Se usó continue para no imprimir el 5</p>" );

   </script>
</head>

    </nav>
</body>
</html>
