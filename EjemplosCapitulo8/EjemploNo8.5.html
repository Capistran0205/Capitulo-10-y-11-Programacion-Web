<!-- Suma con la estructura de repetición for. -->
<html>
<head>
   <meta charset="utf-8">
   <title>Ejemplo 8.5: Sumar los enteros pares del 2 al 100</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <script>
      document.writeln("<h1>Ejemplo 8.5: Suma con la estructura de repetición for.</h1>");
      var suma = 0;

      for ( var numero = 2; numero <= 100; numero += 2 )
         suma += numero;

      document.writeln( "La suma de los enteros pares " +
         "del 2 al 100 es " + suma );

   </script>
</head>
