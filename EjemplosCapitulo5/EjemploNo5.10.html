<!DOCTYPE html>
<!-- Fig. 5.10: bordeimagen.html -->
<!-- Estirar y repetir una imagen para crear un borde. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejemplo No 5.10: Borde de imagen</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" type="text/css" href="/Estilos/Botones.css">
         <style type="text/css">
         /* Usamos :not para que los estilos de las cajas no afecten al menú de botones */
         div:not(.botones-navegacion) {
            border-width: 30px;
            border-style: solid; /* Requerido por algunos navegadores para renderizar el border-image */
            width: 234px;
            padding: 20px;
            margin-bottom: 20px;
         }
         #stretch {
            border-image: url('/Resources/border.png') 80 80 80 80 stretch;
         }
         #repeat {
            border-image: url('/Resources/border.png') 34% 34% repeat;
         }
         /* Limpiamos cualquier flujo flotante y damos espacio a la navegación */
         .botones-navegacion {
            clear: both;
            margin-top: 20px;
         }
      </style>
      </style>
   </head>
   <body>
      <h2>Ejemplo No 5.10: Borde de imagen</h2>
      <hr>
      <img src = "/Resources/border.png" alt = "Recurso no encontrado">
      <p><div id = "stretch">Se estira el borde de la imagen</div></p>
      <p><div id = "repeat">Se repite el borde de la imagen</div></p>

         <a class="boton" href = "Index_Ejemplos.html">Menú Principal</a>

         <a class="boton" href = "EjemploNo5.11.html">&rarr;Siguiente</a>
      </nav>
   </body>
</html>
