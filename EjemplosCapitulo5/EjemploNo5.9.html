<!DOCTYPE html>
<!-- Fig. 5.9: reflejo.html -->
<!-- Reflejos en CSS3. -->
<html>

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Ejemplo No 5.9: Reflejo</title>
   <link rel="stylesheet" type="text/css" href="/Estilos/Botones.css">
   <style type="text/css">
      .galeria{
         padding-bottom: 200px;
      }
      img {
         margin-right: 30px;
      }

      img.below {
         -webkit-box-reflect: below 5px -webkit-gradient(linear, left top, left bottom,
               from(transparent), to(white));
      }

      img.right {
         -webkit-box-reflect: right 5px -webkit-gradient(linear, right top, left top,
               from(transparent), to(white));
      }
   </style>
</head>

<body>
   <h1>Ejemplo No 5.9: Reflejo de imágenes</h1>
   <hr>
   <div class = "galeria">
      <img class="below" src="/Resources/jhtp.png" width="138" height="180"
         alt="Recurso no encontrado de la portada Java How to Program book cover">
      <img class="right" src="/Resources/jhtp.png" width="138" height="180"
         alt="Recurso no encontrado de la portada Java How to Program book cover">
   </div>

      <a class="boton" href="Index_Ejemplos.html">Menú Principal</a>
      <a class="boton" href="EjemploNo5.8.html">&larr;Anterior</a>
      <a class="boton" href="EjemploNo5.10.html">&rarr;Siguiente</a>
   </nav>
</body>

</html>
