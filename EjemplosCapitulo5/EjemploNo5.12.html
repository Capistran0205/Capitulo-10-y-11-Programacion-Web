<!DOCTYPE html>
<!-- Fig. 5.12: transiciones.html -->
<!-- Transiciones en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Ejemplo No 5.12: Transiciones en CSS3</title>
      <link rel="stylesheet" type="text/css" href="/Estilos/Botones.css">
      <style type = "text/css"> 
         img
         {
            margin: 80px;
            -webkit-transition: -webkit-transform 4s; 
            -moz-transition: -moz-transform 4s; 
            -o-transition: -o-transform 4s; 
            transition: transform 4s;
         }
         img:hover
         {
            -webkit-transform: rotate(360deg) scale(2, 2); 
            -moz-transform: rotate(360deg) scale(2, 2);
            -o-transform: rotate(360deg) scale(2, 2); 
            transform: rotate(360deg) scale(2, 2);
         }
      </style>
   </head>
   <body>
      <h1>Ejemplo No 5.12: Transiciones en CSS3</h1>
      <hr>
      <img src = "/Resources/cpphtp.png" width = "76" height = "100"
         alt = "C++ How to Program book cover">

         <a class = "boton" href = "EjemploNo5.13.html">&rarr;Siguiente</a>
      </nav>
   </body>
</html>
