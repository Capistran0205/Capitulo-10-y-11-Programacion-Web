<!DOCTYPE html>
<!-- Fig. 5.7: textstroke.html -->
<!-- Trazo de texto en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Ejemplo No 5.7: Trazo en texto</title>
      <link rel="stylesheet" type="text/css" href="/Estilos/Botones.css">
      <style type = "text/css">
         h2, p
         {
            color: lightcyan;
            -webkit-text-stroke: 2px black; /* prefijo de vendedor */
            font-size: 500%; /* aumenta el tamaño de la fuente */
         }
      </style>
   </head>
<body>
   <h1>Ejemplo No 5.7: Trazo de texto</h1>
   <hr>
   <h2>Trazo de texto</h2>
   <p>Ingenieria en Sistemas Computacionales</p>

</html>
