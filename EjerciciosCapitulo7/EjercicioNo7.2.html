<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <title>Ejercicio de Autoevaluación 7.2</title>
    <script>
        document.writeln("<h1>Ejercicio de Autoevaluación 7.2</h1>")
        // Declaración de x
        var x = 0;
        // 4 formas diferentes de sumar un 1 a una variable
        document.writeln("<p>Valor Inicial de X: " + x + "</p>");
        x = x + 1;
        document.writeln("<p>Valor Nuevo Valor X: " + x + "</p>");
        x += 1;
        document.writeln("<p>Valor Inicial de X: " + x + "</p>");
        ++x;
        document.writeln("<p>Valor Inicial de X: " + x + "</p>");
        x++;
    </script>
</head>
