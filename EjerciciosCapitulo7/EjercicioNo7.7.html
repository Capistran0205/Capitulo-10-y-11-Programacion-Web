  <title>Ejercicio de Autoevaluación 7.7</title>
  <script>
    document.writeln("<h1> Ejercicio de Autoevaluación 7.7 </h1>");
    document.writeln("<hr>");
    document.writeln("<p> Identifique y corrija los <em>errores</em> de cada uno de los siguientes segmentos de código:</p>");
    document.writeln("<hr>");
    document.writeln("<ol type = 'a'> <li></li>");
    document.writeln("<img class = 'imagen' src = \"/Resources/Error(a)7.7.png\">");
    document.writeln("<p> Falta la llave del cierre del while</p>");
    document.writeln("<li></li>");
    document.writeln("<img class = 'imagen' src = \"/Resources/Error(b)7.7.png\">")
    document.writeln("<p>El ; después del else produce un error lógico</p>");
    document.writeln("</ol>");
    document.writeln("<h2> Soluciones: </h2>");
    document.writeln("<ol type = 'a'> <li></li>");
    var c, producto;
    c = 1;
    producto = 1;
    while (c <= 5) {
      producto *= c;
      ++c;
    }
    document.writeln("<img class = 'imagen' src = \"/Resources/Solucion(a)7.7.png\">");
    document.writeln("<li></li>");
    document.writeln("<p>Total del producto: " + producto + "</p>");
    document.writeln("<li></li>");
    document.writeln("<img class = 'imagen' src = \"/Resources/Solucion(b)7.7.png\">");
    var genero;
    genero = 2;
    if (genero == 1)
      document.writeln("<p>Mujer</p>");
    else
      document.writeln("<p>Hombre</p>");
    document.writeln("</ol>");
  </script>
