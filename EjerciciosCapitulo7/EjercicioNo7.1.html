      <h1>Ejercicio de autoevaluación 7.1</h1>
      <p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>

      <script>
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Todas las secuencias de comandos pueden escribirse en términos de tres tipos de estructuras de control: <span class = 'respuesta'>Secuencia</span>, <span class = 'respuesta'>selección</span> y <span class = 'respuesta'>repetición</span>.</li>" );
         document.writeln( "<li>La instrucción de selección doble <span class = 'respuesta'>if, else</span> se utiliza para ejectuar una acción cuando una condición es verdadero, y otra acción cuando esa condición es falsa.</li>" );
         document.writeln( "<li>Al proceso de repetir un conjunto de instrucciones un número específico de veces se le llama repetición <span class = 'respuesta'>controlada por contador (o definida)</span>.</li>" );
         document.writeln( "<li>Cuando no se sabe de antemano cuánta veces se repetirá un conjunto de instrucciones, se puede usar un valor <span class = 'respuesta'>centinela</span> (o un valor <span class = 'respuesta'>de señal</span>, <span class = 'respuesta'>de bandera</span> o <span class = 'respuesta'>de prueba</span>) para terminar la repetición.</li>" );
         document.writeln( "</ol>" );
      </script>
