<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Autoevaluación 7.6</title>
    <script>
        document.writeln("<h1> Ejercicio de Autoevaluación 7.6 </h1>");
        document.writeln("<p> Determinar el valor de cada variable después de realizar el cálculo. Suponer que, cuando se empieza a ejecutar cada instrucción, todas las variables tienen el valor entero 5.</p>");
        // Declarando e inicializando variables
        var producto = 5, cociente = 5, x = 5;
        producto *= x++;
        document.writeln("<p>producto = " + producto + ", x = " + x + "</p>");

        x = 5;
        cociente /= ++x;
        document.writeln("<p>cociente = " + cociente + ", x = " + x + "</p>");
    </script>
</head>
