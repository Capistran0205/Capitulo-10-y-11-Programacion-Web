<head>

    <link rel="stylesheet" href="/Estilos/Botones.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Autoevaluación 7.5</title>
    <script>
    document.writeln( "<h1> Ejercicio de Autoevaluación 7.5 </h1>" );
    document.writeln( "<p>Combinar las instrucciones del ejercicio 7.4 para formar una secuencia de de comandos que calcule e imprima la suma de los enteros del 1 al 10."+ 
                          "Usar la instrucción while para iterar a través de las instrucciones de cálculo e incremento."+ 
                          "El ciclo desde terminar cuando el valor de x se vuelve 11</p>" );
    // declarando x y suma
    var x, suma;

    // incializando x y suma
    x = 1;
    suma = 0;

    while(x <= 10){
        suma += x;
        ++x;
    }

   document.writeln( "<code> El resultado de la suma es: "+ suma +" </code>" );
</script>
