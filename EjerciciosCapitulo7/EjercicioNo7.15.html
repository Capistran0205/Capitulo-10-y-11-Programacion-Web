<!DOCTYPE html>
<!-- Ejercicio 7.15: EjercicioNo7.15.html -->
<!-- Encontrar el mayor de 10 números de un solo dígito. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <script>
        document.writeln("<h1>Ejercicio 7.15: Encontrar el mayor de 10 números de dos dígitos</h1>");
        document.writeln("<hr>");
        document.writeln("<p>Escribir un algoritmo en pseudocódigo y después una secuencia de comandos que reciba 10 números de un solo dígito, determine el mayor y muestre un mensaje con él. Usar las variables contador, numero y mayor.</p>");
        document.writeln("<hr>");
        document.writeln("<pre><code>"); // Etiqueta para indicarle al navegador que no debe formatear (acomodar el texto), debe dejarlo en su formato original
        document.writeln("Inicio");
        document.writeln("    Inicializar contador &larr; 1");
        document.writeln("    Inicializar mayor &larr; -1");
        document.writeln("");
        document.writeln("    Mientras contador &lt;= 10 Repetir");
        document.writeln("        Leer(numero)    // siguiente número ingresado por el usuario");
        document.writeln("");
        document.writeln("        Si numero &gt; mayor Entonces");
        document.writeln("            mayor &larr; numero");
        document.writeln("        Fin Si");
        document.writeln("");
        document.writeln("        contador &larr; contador + 1");
        document.writeln("    Fin Mientras");
        document.writeln("");
        document.writeln("    Imprimir \"El número más grande ingresado es \" + mayor");
        document.writeln("Fin");
        document.writeln("</code></pre>");
        var contador = 1; // cuenta los números introducidos
        var numero; // el número más reciente introducido por el usuario
        var mayor = -1; // el número más grande encontrado hasta ahora

        while (contador <= 10) {
            numero = parseInt(window.prompt(
                "Escriba un número de un solo dígito (" + contador + " de 10):",
                "0"));
            if(numero >= 10){
                window.alert("Número inválido: "+ numero);
                continue;
            }

            if (numero > mayor)
                mayor = numero;

            ++contador;
        } // fin de while

        document.writeln(
            "<h1>El número más grande es " + mayor + "</h1>");

    </script>
    <title>Ejercicio 7.15</title>
</head>
