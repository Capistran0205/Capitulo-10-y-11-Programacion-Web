<!DOCTYPE html>
<!-- Fig. 2.15 formulario.html -->
<!-- Formulario que usa una variedad de componentes. -->
<html>
    <head>
        <meta charset = "utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>M&aacute;s formularios</title>
        <link rel="stylesheet" type = "text/css" href = "/Estilos/Botones.css">
    </head>
    <body>
        <h1>Decimotercero Ejemplo de HTML: M&aacute;s formularios</h1>
        <hr>
        <h1>Formulario de cosas para aprender</h1>
        <p>Llene este formulario para aprender algo nuevo
        
        <!-- esta etiqueta empieza el formulario, indica el método de enviar información y la ubicación de la secuencia de comandos de procesamiento del formulario -->
        <form method = "post" action = "http://www.itsx.edu.mx/">
            <!-- las entradas ocultas contienen información no visual que también se enviará -->
            <input type = "hidden" name = "destinatario" value = "generacion2023@gmail.com">
            <input type = "hidden" name = "asunto" value = "formulario de retroalimentaci&oacute;n">
            <input type = "hidden" name = "redirigir" value = "Index.html">

        <!-- <input type = "text"> inser un campo de texto -->
            <p><label>Nombre:
                <input name = "nombre" type = "text" size = "25" maxlength = "30">
            </label></p>
            <p><label>Comentarios: <br>
                <textarea name = "comentarios" 
                rows = "4" cols = "36">Escriba aqu&iacute; sus comentarios.</textarea>
            </label></p>
            <!-- <input type = "password"> inserta un cuadro de texto que aparece enmascarado con caracteres de asterisco-->
             <p><label>Direcci&oacute;n de corre electr&oacute;nico
                <input name = "email" type = "password" size = "25">
             </label></p>

             <p>
                <strong>Cosas que le gustaría aprender</strong>

                <label>Machine Learning
                    <input name = "cosasgustaron" type = "checkbox" value = "Machine Learning">                
                </label>
                <label>Amazon Web Services y Azure
                    <input name = "cosasgustaron" type = "checkbox" value = "Cómputo en la Nube">                
                </label>
                <label>Desarrollo Web
                    <input name = "cosasgustaron" type = "checkbox" value = "Desarrollo Web">
                </label>
                <label>Computación Cu&aacute;ntica
                    <input name = "cosasgustaron" type = "checkbox" value = "Computacion Cuantica">
                </label>
             </p>

             <p>
                <label>
                    Califique nuestro sitio:
                    <select name = "calificacion">
                        <option selected>Sorprendente</option>
                        <option>10</option>
                        <option>9</option>
                        <option>8</option>
                        <option>7</option>
                        <option>6</option>
                        <option>5</option>
                        <option>4</option>
                        <option>3</option>
                        <option>2</option>
                        <option>1</option>
                        <option>Sin comentarios</option>
                    </select>
                </label>
             </p>

            <p>
                <!-- los tipos de entrada "submit" y "reset" insertan botones para enviar y borrar el contenido del formulario, respectivamente-->
                <input type = "submit" value = "Enviar">
                <input type = "reset" value = "Borrar">
            </p>
            </p>
        <hr>
        <nav>
            <span><a class = "boton" href = "Index_Ejemplos.html">Menú Principal</a></span>
            <span><a class = "boton" href="EjemploNo2.14.html">&larr; Anterior</a></span>
            <span><a class = "boton" href = "EjemploNo2.16.html">&rarr; Siguiente</a></span>
        </nav>
       </form>
    </body>
</html>
