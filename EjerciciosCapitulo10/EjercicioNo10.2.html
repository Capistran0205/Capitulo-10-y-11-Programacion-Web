      <script>
         // la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación
         document.writeln( "<h1>Ejercicio de Autoevaluación 10.2</h1>")
         document.writeln( "<hr>" );
         document.writeln( "<p>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Un arreglo puede almacenar muchos tipos diferentes de valores.<span class = 'respuesta'> Verdadero</span>.</li>" );
         document.writeln( "<li>Por lo general el índice de un arreglo debe ser un valor de punto flotante.<span class = 'respuesta'> Falso. El índice debe ser un entero o una expresión entera, no un valor de punto flotante.</span>.</li>" );
         document.writeln( "<li>Un elemento individual de un arreglo que se pasa a una función y se modifica en ésta se debe contener el valor modificado cuando la función invocada complete su ejecución. <span class = 'respuesta'>Falso."+
            " Un elemento de tipo primitivo (número, booleano, cadena) se pasa por valor, así que la función modifica una copia. Si se pasa el arreglo completo (una referencia), los cambios sí afectan al original. Un elemento que sea un objeto también se pasa por referencia.</span>.</li>" );
         document.writeln( "</ol>" );
      </script>
