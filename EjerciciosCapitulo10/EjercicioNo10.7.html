      <meta charset="utf-8">
      <title>Ejercicio 10.7: Enunciados verdadero y falso.</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="/Estilos/Botones.css">
      <link rel="stylesheet" href="/Estilos/EspaciosBlanco.css">
      <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
      <script>
         // la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación
         document.writeln( "<h1>Ejercicio 10.7: Enunciados verdadero y falso</h1>")
         document.writeln( "<hr>" );
         document.writeln( "<p>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Para hacer referencia a una ubicación o elemento específico de un arreglo, específicamos el nombre del valor del elemento.<span class = 'respuesta'> Falso.  Para referirse a un elemento se especifica el nombre del arreglo y su índice (posición), no el valor del elemento.</span>.</li>" );
         document.writeln( "<li>La declaración de una variable reserva espacio para un arreglo.<span class = 'respuesta'> Falso. Declarar una variable no reserva el espacio del arreglo. Hay que crear el objeto con new Array(...) o con una lista inicializadora</span>.</li>" );
         document.writeln( "<li>Para indicar que deben reservarse 100 ubicaciones para el arreglo entero p, el programador debe escribir la siguiente declaración: <code>var p = new Array( 100 );</code><span class = 'respuesta'>(supuesto: el código del enunciado no se lee; el original muestra una declaración tipo var p[ 100 ];, que no es sintaxis válida de JavaScript). La forma correcta es:</span></li>" );
         document.writeln( "<li>Un programa de JavaScript que inicializa los elementos de un arreglo de 15 elementos en cero debe contener cuando menos una instrucción for. <span class = 'respuesta'>Falso. Se puede inicializar con una lista inicializadora ([ 0, 0, 0, ... ]) o con asignaciones individuales, sin usar for.</span></li>" );
         document.writeln( "<li>Un programa de JavaScript que calcula el total de los elementos de un arreglo bidimensional debe contener instrucciones for anidadas. <span class = 'respuesta'>Falso. Se podría sumar con asignaciones o expresiones individuales. Las instrucciones for anidadas son lo más práctico, pero no son obligatorias.</span></li>" );
         document.writeln( "</ol>" );
      </script>
