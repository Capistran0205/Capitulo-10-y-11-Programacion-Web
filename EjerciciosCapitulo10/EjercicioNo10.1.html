         document.writeln( "<p>Complete las siguientes oraciones.</p>" );

         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Se pueden almacenar listas y tablas de valores en <span class = 'respuesta'> arreglos</span>.</li>" );

         document.writeln( "<li>Al proceso de de determinar si un arreglo contiene cierto valor clave se le conoce como <span class = 'respuesta'> buscar </span> el arreglo</li>" );
         document.writeln( "<li>Un arreglo que utiliza dos índices se conoce como arreglo <span class = 'respuesta'>bidimensional</span>.</li>" );
         document.writeln( "</ol>" );
