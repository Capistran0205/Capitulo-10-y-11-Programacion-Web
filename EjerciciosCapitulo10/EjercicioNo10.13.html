    <title>Ejercicio 10.13: Orden en que se inicializan los elementos de una matriz</title>
    <script>
        document.writeln( "<h1>Ejercicio 10.13: Orden en que se inicializan los elementos de una matriz</h1>" );
        document.writeln( "<hr>" );
        document.writeln( "<p>Etiquete los elementos del arreglo bidimensional de tres por cinco llamado ventas para indicar"+
                          "el orden en el que se deben establecer en cero mediante el sigueinte segmento de código:</p>" );
        document.writeln( "<img class = 'imagen' src = \"/Resources/Codigo10.13.png\"" );
        document.writeln( "<hr>" );
        document.writeln( "<h2>Solución:</h2>" );
        document.writeln( "<p>El primer ciclo for <code>for ( var fila in ventas ) </code> se encarga de recorrer las filas de la matriz y el for interior <code>for ( var col in venta[fila] )</code> interior recorre las columnas de la fila actual. El llenado es de izquieda a derecha.</p>" );
    </script>
