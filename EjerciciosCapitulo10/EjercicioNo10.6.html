      <script>
         <!-- la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación-->
         document.writeln( "<h1>Ejercicio 10.6: Completar las oraciones</h1>")
         document.writeln( "<hr>" );
         document.writeln( "<p>Complete las siguientes oraciones.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Javascipt almacena los valores en <span class = 'respuesta'> arreglos</span>.</li>" );
         document.writeln( "<li>Los nombres de los cuatro elementos de un arreglo p son<span class = 'respuesta'> p[0], p[1], p[2], p[3]</span>.</li>" );
         document.writeln( "<li>En un arreglo bidimensional el primer indice identifica la <span class = 'respuesta'>fila</span> y el segundo <span class = 'respuesta'>columna</span>.</li>" );
         document.writeln( "<li>Un arreglo de m por n contiene <span class = 'respuesta'> m </span> filas, <span class = 'respuesta'> n </span> columnas y<span class = 'respuesta'> m x n </span>elementos.</li>" );
         document.writeln( "<li>El nombre del elemento en la fila 3 y columna 5 del areglo d es <span class = 'respuesta'>d[3][5]</span>.</li>" );
         document.writeln( "</ol>" );
      </script>
