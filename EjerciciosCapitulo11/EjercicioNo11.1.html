      <script>
         <!-- la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación-->
         document.writeln( "<h1>Ejercicio de Autoevaluación 11.1</h1>")
         document.writeln( "<hr>" );
         document.writeln( "<p>Complete las siguientes oraciones.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Como JavaScript usa objetos para realizar muchas tareas, se conoce por lo común como <span class = 'respuesta'> lenguaje de programación basado en objetos</span>.</li>" );
         document.writeln( "<li>Todos los objetos tienen <span class = 'respuesta'>atributos </span>y exhiben <span class = 'respuesta'> comportamientos</span>.</li>" );
         document.writeln( "<li>Los métodos del objeto <span class = 'respuesta'> Math </span> nos permite realizar muchos cálculos matemáticos comunes.</li>" );
         document.writeln( "<li>Al proceso de invocar (o llamar) al método de un objeto se le conoce como <span class = 'respuesta'> instancia/enviar un mensaje al objeto</span>.</li>" );
         document.writeln( "<li>Las literales de cadena o constantes de cadena se escriben como una secuencia de caracteres en <span class = 'respuesta'>comillas dobles</span> o <span class = 'respuesta'>comillas sencillas</span>.</li>" );
         document.writeln( "<li>Los índices para los caracteres en una cadena empiezan en <span class = 'respuesta'>0</span>.</li>" );
         document.writeln( "<li>Los métodos <span class = 'respuesta'>indexOf</span> y <span class = 'respuesta'>lastIndexOf</span>.</li>" );
         document.writeln( "<li>Al proceso de dividir una cadena en tokens se le denomina <span class = 'respuesta'> tokenización </span>.</li>" );
         document.writeln( "<li>EL procesamiento de fechas y horas puede realizarse con base en la <span class = 'respuesta'>zona horaria local de la computadora</span> o en el <span class = 'respuesta'>Tiempo Universal Coordinado</span>.</li>" );
         document.writeln( "<li>El método <span class = 'respuesta'>parse</span> de Date recibe como argumento una cadena que representa una fecha y hora, y devuelve el número de milisegundos transcurridos entre la medianoche del 1 de enero de 1970 y la fecha y hora especificadas.</li>" );       
         document.writeln( "<li>Las aplicaciones Web pueden usar la propiedad <span class = 'respuesta'>localStorage</span> del objeto window para almacenar hasta varios megabytes de datos de cadenas de pares clave/valor en la computador del usuario y pueden acceder a estos datos a través de sesiones y pestañas del navegador.</li>" );
         document.writeln( "<li>Las aplicaciones Web que necesitan acceso a los datos de pares clave/valor para sólo una sesión de navegación y que deben mantener esos datos separados entre varias pestañas pueden usar la propiedad <span class = 'respuesta'>sessionStorage</span> del objeto window.</li>" );
         document.writeln( "<li>Un selector <span class = 'respuesta'>:first-child</span> de CSS3 selecciona el primer hijo de un elemento.</li>" );
         document.writeln( "<li>Un selector <span class = 'respuesta'>:nth-child.</span> de CSS3 con el argumento \"odd\" selecciona los elementos hijos impares y uno con el argumento \"even\" selecciona los elementos.</li>" );
         document.writeln( "</ol>" );
      </script>
