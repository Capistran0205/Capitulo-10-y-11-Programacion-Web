<!-- Bordes de los elementos a nivel de bloque.-->
 <html>
    <head>
        <meta charset = "utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 4.14: Borders</title>
        <style>
            div            { text-align: center; 
                             width: 50%;
                             position: relative;
                             left: 25%;
                             border-width: 6px;}
            .thick         { border-width: thick; }
            .medium        { border-width: medium; }
            .thin          { border-width: thin; }
            .solid         { border-width: solid; }
            .double        { border-style: double; }
            .groove        { border-style: groove; }
            .ridge         { border-style: ridge; }
            .dotted        { border-style: dotted; }
            .inset         { border-style: inset; }
            .outset        { border-style: outset; }
            .dashed        { border-style: dashed; }
            .ridge         { border-color: red;}
            .blue          { border-color: blue;}
        </style>
        <link rel="stylesheet" type = "text/css" href = "/Estilos/Botones.css">
    </head>
    <body>
        <h1>Ejercicio 4.14: Borders</h1>
        <hr>
        <div class = "solid">Borde s&oacute;lido</div><br>
        <div class = "double">Doble borde</div><br>
        <div class = "groove">Borde ranurado</div><br>
        <div class = "ridge">Borde rugoso</div><br>
        <div class = "dotted">Borde punteado</div><br>
        <div class = "inset">Borde incrustado</div><br>
        <div class = "thin dashed">Borde grueso intermitente</div><br>
        <div class = "thin red solid">Borde s&oacute;lido rojo delgado</div><br>
        <div class = "medium blue outset">Borde saliente azul mediano</div><br>

 </html>
