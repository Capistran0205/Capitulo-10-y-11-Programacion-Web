<!DOCTYPE html>
<!-- Fig 4.1: enlinea.html-->
<!-- Uso de estilos en linea.-->
 <html>
    <head>
        <meta charset = "utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Estilos en l&iacute;nea</title>
        <link rel="stylesheet" type = "text/css" href = "/Estilos/Botones.css">
    </head>
    <body>
        <h1>Ejemplo 4.1: Estilos en línea</h1>
        <hr>
        <p>Este texto no tiene aplicado nin&uacute;n estilo</p>
        <!-- El atributo style nos permite declarar -->
        <!-- estilos en linea. Debemos separar varias-->
        <!-- propiedades de style con punto y coma.-->
         <p style = "font-size: 20pt;">Este texto tiene aplicado el estilo
            <em>font-size</em>, para que sea de 20pt.
         </p>

        <p style = "font-size: 20pt; color: deepskyblue;"> Este texto
            tiene aplicados estilos <em>font-size</em> y <em>color</em>, 
            para que sea de 20pt y de color azul cielo profundo.
        </p>

            <a class = "boton" href="Index_Ejemplos.html">Menú Principal</a>
            <a class = "boton" href="EjemploNo4.3.html">&rarr;Siguiente</a>
        </nav>
    </body>
 </html>
