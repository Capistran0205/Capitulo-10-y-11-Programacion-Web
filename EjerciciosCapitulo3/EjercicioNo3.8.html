<body>
    <h1>Ejercicio 3.8: Creación de un formulario autocomplete y un elemento datalist</h1>
    <hr>
    <p>Cree un elemento input autocomplete con un elemento datalist asociado que contenga los días de la semana
    </p>
    <hr>
    <form action="https://gaatx.itsx.edu.mx/auth/login" method="post">
        <label for="dia">Selecciona un día de la semana:</label>
        <input type="text" id="dia" name="dia" list="listaDias" placeholder="Selecciona un día de la semana">
        <datalist id="listaDias">
            <option value="Lunes">
            <option value="Martes">
            <option value="Miércoles">
            <option value="Jueves">
            <option value="Viernes">
            <option value="Sábado">
            <option value="Domingo">
        </datalist>
    </form>
