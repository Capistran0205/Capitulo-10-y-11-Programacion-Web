<!DOCTYPE html>

<!-- Fig. 9.4: EntAleatorio.html -->
<!-- Enteros aleatorios, desplazar y escalar. -->
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <title>Ejemplo 9.4: Desplazar y escalar enteros aleatorios</title>
   <style type="text/css">
      p, ol { margin: 0; }
      li { display: inline; margin-right: 10px; }
   </style>
   <script>
      document.writeln( "<h1>Ejemplo 9.4: Desplazar y escalar enteros aleatorios</h1>" );
      document.writeln( "<hr>" );
      document.writeln( "<h2>Solución: </h2>" );

      var valor;
      document.writeln( "<p>N&uacute;meros aleatorios</p><ol>" );

      for ( var i = 1; i <= 30; ++i )
      {
         valor = Math.floor( 1 + Math.random() * 6 );
         document.writeln( "<li>" + valor + "</li>" );
      } // fin del for

      document.writeln( "</ol>" );

   </script>
</head>
