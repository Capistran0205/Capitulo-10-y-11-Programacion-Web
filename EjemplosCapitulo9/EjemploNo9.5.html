<!DOCTYPE html>

<!-- Fig. 9.5: TirarDados.html -->
<!-- Generación de imágenes aleatorias de dados usando Math.random. -->
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <link rel="stylesheet" href="/Estilos/ImagenesDados.css">
   <title>Ejemplo 9.5: Im&aacute;genes aleatorias de dados</title>
   <script>
      document.writeln( "<h1>Ejemplo 9.5: Generación de imágenes aleatorias de dados usando Math.random</h1>" );
      document.writeln( "<h2>Solución: </h2>" );
      // variables utilizadas para interactuar con los elementos img
      var imagenDado1;
      var imagenDado2;
      var imagenDado3;
      var imagenDado4;

      // registrar componente de escucha del botón y obtener los elementos img
      function iniciar()
      {
         var boton = document.getElementById( "botonTirar" );
         boton.addEventListener( "click", tirarDados, false );

         imagenDado1 = document.getElementById( "dado1" );
         imagenDado2 = document.getElementById( "dado2" );
         imagenDado3 = document.getElementById( "dado3" );
         imagenDado4 = document.getElementById( "dado4" );
      } // fin de la función iniciar

      // tirar los dados
      function tirarDados()
      {
         establecerImagen( imagenDado1 );
         establecerImagen( imagenDado2 );
         establecerImagen( imagenDado3 );
         establecerImagen( imagenDado4 );
      } // fin de la función tirarDados

      // seleccionar el origen de la imagen de un dado
      function establecerImagen( imgDado )
      {
         var valorDado = Math.floor( 1 + Math.random() * 6 );
         imgDado.setAttribute( "src", "/Resources/dado" + valorDado + ".png" );
         imgDado.setAttribute( "alt",
            "imagen de un dado con " + valorDado + " punto(s)" );
      } // fin de la función establecerImagen

      window.addEventListener( "load", iniciar, false );
   </script>
</head>
<body>
   <form action="#">
      <input id="botonTirar" type="button" value="Tirar dados">
   </form>
   <ol>
      <li><img id="dado1" src="/Resources/blanco.jpg" alt="imagen en blanco"></li>
      <li><img id="dado2" src="/Resources/blanco.jpg" alt="imagen en blanco"></li>
      <li><img id="dado3" src="/Resources/blanco.jpg" alt="imagen en blanco"></li>
      <li><img id="dado4" src="/Resources/blanco.jpg" alt="imagen en blanco"></li>
   </ol>

        <span><a class="boton" href="EjemploNo9.6.html">Siguiente &rarr;</a></span>
    </nav>
</body>
</html>
