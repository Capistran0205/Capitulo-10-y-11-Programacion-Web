<!DOCTYPE html>

<!-- Fig. 9.12: PruebaFactorial.html -->
<!-- Cálculo del factorial con una función recursiva. -->
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <title>Ejemplo 9.12: Funci&oacute;n factorial recursiva</title>
   <style type="text/css">
      p { margin: 0px; }
   </style>
   <script>
      document.writeln("<h1>Ejemplo 9.12: Funci&oacute;n factorial recursiva.</h1>" );
      document.writeln( "<hr>" );
      document.writeln( "<h2>Solución: </h2>" );
      var salida = ""; // almacena la salida

      // calcula los factoriales de 0 a 10
      function calcularFactoriales()
      {
         for ( var i = 0; i <= 10; ++i )
            salida += "<p>" + i + "! = " + factorial( i ) + "</p>";

         document.getElementById( "resultados" ).innerHTML = salida;
      } // fin de la función calcularFactoriales

      // Definición recursiva de la función factorial
      function factorial( numero )
      {
         if ( numero <= 1 ) // caso base
            return 1;
         else
            return numero * factorial( numero - 1 );
      } // fin de la función factorial

      window.addEventListener( "load", calcularFactoriales, false );
   </script>
</head>
<body>
   <h3>Factoriales de 0 a 10</h3>
   <div id="resultados"></div>

        <span><a class="boton" href="Index_Ejemplos.html">Menú Principal</a></span>
        <span><a class="boton" href="EjemploNo9.9.html">&larr; Anterior</a></span>
    </nav>
</body>
</html>
