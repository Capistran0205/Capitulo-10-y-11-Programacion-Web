<!DOCTYPE html>

<!-- Fig. 9.2: CuadradoEnt.html -->
<!-- Función cuadrado definida por el programador. -->
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <title>Ejemplo 9.2: Una funci&oacute;n cuadrado definida por el programador</title>
   <style type="text/css">
      p { margin: 0; }
   </style>
   <script>
      document.writeln( "<h1> Ejemplo 9.2: Función cuadrado definido por el programador</h1>" );
      document.writeln( "<hr>" );
      document.writeln( "<h2>Obtener el cuadrado de los n&uacute;meros del 1 al 10</h2>" );
      document.writeln( "<h3>Resultado Obtenido: </h3>" );
      // obtener el cuadrado de los números del 1 al 10
      for ( var x = 1; x <= 10; ++x )
         document.writeln( "<p>El cuadrado de " + x + " es " +
            cuadrado( x ) + "</p>" );

      // El cuerpo de la siguiente definición de la función cuadrado se ejecuta
      // sólo cuando la función se llama de manera explícita como en la línea 19
      function cuadrado( y )
      {
         return y * y;
      } // fin de la función cuadrado

   </script>
</head>
