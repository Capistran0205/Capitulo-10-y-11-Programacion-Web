    <title>Ejercicio 6.15: Secuencia de comandos</title>
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <script>
        document.writeln("<h1>Ejercicio 6.15: Secuencia de comandos con 'writeln()' y 'write()' </h1>");
        document.writeln("<hr>");
        document.writeln("<p>Escriba una secuencia de comandos que muestre los números del 1 al 4 en la misma línea, con cada para de números adayacentes separados por un espacio. Escriba la secuencia de comandos usando los métodos 'writeln()' y 'write'</p>");
        document.writeln("<hr>");
        document.writeln("<ol type = 'a'> <li> Use una instrucción document.writeln()</li>");
        document.writeln("<details>");
        document.write("<sumarize>Solucíón</sumarize><br>");
        document.writeln("1 2 3 4");
        document.write("</details>")
        document.writeln("<li> Use una instrucción document.write()</li>");
        document.writeln("<details>");
        document.write("<sumarize>Solucíón</sumarize> <br>");
        document.write("1 ");
        document.write("2 ");
        document.write("3 ");
        document.write("4 ");
        document.write("</details>")
        

    </script>
