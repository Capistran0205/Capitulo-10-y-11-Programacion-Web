   <head>
      <meta charset="utf-8">
      <title>Ejercicio de autoevaluación 6.5</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="/Estilos/Botones.css">
      <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
      <link rel="stylesheet" href="/Estilos/EspaciosBlanco.css">
      <script>
         document.writeln( "<h1>Ejercicio de Autoevaluación 6.5</h1>")
         document.writeln(" <p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p> ");
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Indique que una secuencia de comandos calculará el producto de tres enteros [Sugerencia: use texto que ayude a documentar una secuencia de comandos].<p class='respuesta'><code>// Calcula el producto de tres enteros</code></li>" );
         document.writeln( "<li>Declare las variables <code>x</code>, <code>y</code>, <code>z</code> y <code>resultado</code>.<p class='respuesta'><code>var x, y, z, resultado;</code></p></li>" );
         document.writeln( "<li>Declare las variables <code>xVal</code>, <code>yVal</code> y <code>zVal</code>.<p class='respuesta'><code>var xVal, yVal, zVal;</code></p></li>" );
         document.writeln( "<li>Pida al usuario que introduzca el primer valor, lea el valor del usuario y almacénelo en la variable <code>xVal</code>.<p class='respuesta'><code>xVal = window.prompt( \"Escriba el primer entero:\", \"0\" );</code><</li>" );
         document.writeln( "<li>Pida al usuario que introduzca el segundo valor, lea el valor del usuario y almacénelo en la variable <code>yVal</code>.<p class='respuesta'><code>yVal = window.prompt( \"Escriba el segundo entero:\", \"0\" );</code></li>" );
         document.writeln( "<li>Pida al usuario que introduzca el tercer valor, lea el valor del usuario y almacénelo en la variable <code>zVal</code>.<p class='respuesta'><code>zVal = window.prompt( \"Escriba el tercer entero:\", \"0\" );</code></li>" );
         document.writeln( "<li>Convierta la cadena <code>xVal</code> en un entero y almacene el resultado en la variable <code>x</code>.<p class='respuesta'><code>x = parseInt( xVal );</code></li>" );
         document.writeln( "<li>Convierta la cadena <code>yVal</code> en un entero y almacene el resultado en la variable <code>y</code>.<p class='respuesta'><code>y = parseInt( yVal );</code></li>" );
         document.writeln( "<li>Convierta la cadena <code>zVal</code> en un entero y almacene el resultado en la variable <code>z</code>.<p class='respuesta'><code>z = parseInt( zVal );</code></li>" );
         document.writeln( "<li>Calcule el producto de los tres enteros contenidos en las variables <code>x</code>, <code>y</code> y <code>z</code>, y asigne el resultado a la variable <code>resultado</code>.<p class='respuesta'><code>resultado = x * y * z;</code></li>" );
         document.writeln( "<li>Escriba una línea de texto de HTML5 que contenga la cadena \"El producto es\" seguida del valor de la variable <code>resultado</code>.<p class='respuesta'><code>document.writeln( \"&lt;h1&gt;El producto es \" + resultado + \"&lt;/h1&gt;\" );</code></li>" );
         document.writeln( "</ol>" );
      </script>
   </head>
