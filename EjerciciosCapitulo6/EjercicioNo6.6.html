<head>
   <meta charset="utf-8">
   <title>Ejercicio de autoevaluación 6.6</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
   <link rel="stylesheet" href="/Estilos/EspaciosBlanco.css">
   <script>
      <!-- Calcula el producto de tres enteros -->
      var x, y, z, resultado;


      x = parseInt(window.prompt("Escriba el primer entero:"));
      y = parseInt(window.prompt("Escriba el segundo entero:"));
      z = parseInt(window.prompt("Escriba el tercer entero:"));

      resultado = x * y * z;      
      document.writeln("<h1>Ejercicio 6.6 </h1"); document.writeln("<h2>El producto es " + resultado + "</h2>");
      document.writeln("<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>");
   </script>
