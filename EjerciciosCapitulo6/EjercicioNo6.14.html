 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6.14: Orden de evaluación y valor de x</title>
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
    <link rel="stylesheet" href="/Estilos/Imagenes.css">
    <style>
      li.procedimiento { color: royalblue; }
    </style>
    <script>
         // Mostra resultados
         document.writeln( "<h1>Ejercicio 6.14: Orden de evaluación y valor de x</h1>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Indique el orden de evaluación de los operadores en cada una de las siguientes instrucciones de JavaScript, y muestre el valor de x después de ejecutar cada instrucción.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<ol type = 'a'> <li>x = 7 + 3 * 6 / 2 - 1;</li>");
         document.write( "<details>" + 
            "<summary> Ver solución</summary>"
            +"<ol type ='1'>"
            +"<li class = \"procedimiento\">3 * 6 &rarr; 18</li>"
            +"<li class = \"procedimiento\">18 / 2 &rarr; 9</li>"
            +"<li class = \"procedimiento\">7 + 9 &rarr; 16</li>"
            +"<li class = \"procedimiento\">16 - 1 &rarr; 15</li>"
            +"<li class = \"procedimiento\">Asignación a x"
            +"</ol>"
            +"<p><strong>Resultado: x = 15</strong></p>"
            +"</details>");
         document.writeln( "<li>x = 2 % 2 + 2 * 2 - 2 / 2;</li>" );
         document.write( "<details>" + 
            "<summary> Ver solución</summary>"
            +"<ol type ='1'>"
            +"<li class = \"procedimiento\">2 % 2 &rarr; 0 (de izquierda a derecha entre % y /)</li>"
            +"<li class = \"procedimiento\">2 * 2 &rarr; 4</li>"
            +"<li class = \"procedimiento\">2 / 2 &rarr; 1</li>"
            +"<li class = \"procedimiento\">0 + 4 &rarr; 4</li>"
            +"<li class = \"procedimiento\">4 - 1 &rarr; 3</li>"
            +"<li class = \"procedimiento\">Asignación a x"
            +"</ol>"
            +"<p><strong>Resultado: x = 3</strong></p>"
            +"</details>");
         document.writeln( "<li>x = (3 * 9 * (3 + (9 * 3 / (3))));</li>" );
         document.write( "<details>" + 
            "<summary> Ver solución</summary>"
            +"<ol type ='1'>"
            +"<li class = \"procedimiento\"> &rarr; 0 (de izquierda a derecha entre % y /</li>"
            +"<li class = \"procedimiento\">(3) &rarr; 3</li>"
            +"<li class = \"procedimiento\">9 * 3 &rarr; 27</li>"
            +"<li class = \"procedimiento\">27 / 3 &rarr; 9|</li>"
            +"<li class = \"procedimiento\">3 + 9 &rarr; 12</li>"
            +"<li class = \"procedimiento\">3 * 9 &rarr; 27</li>"
            +"<li class = \"procedimiento\">27 * 12 &rarr; 324</li>"
            +"<li class = \"procedimiento\">Asignación a x"
            +"</ol>"
            +"<p><strong>Resultado: x = 324</strong></p>"
            +"</details>");
    </script>
