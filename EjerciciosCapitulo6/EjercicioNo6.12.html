    <script>
         // Mostra resultados
         document.writeln( "<h1>Ejercicio 6.12: Variables cuyos valores se modifican</h1>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>¿Cuál de las siguientes instrucciones de JavaScript contiene variables cuyos valores se modifican?</p>" );
         document.writeln( "<hr>" );
         document.writeln("<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>");            
         document.writeln( "<ol type = 'a'> <li>p = i + j + k + 7; </li>");
         document.writeln( "<p class = 'respuesta'>Se asigna a la variable p el valor de la sumatoria de <em>i</em>, <em>j</em>, <em>k</em> y <em>7</em></p>" );         
         document.writeln( "<li>window.alert(\"Variables cuyos valores se destruyen\");</li>" );    
         document.writeln( "<p class = 'respuesta'>Solo se muestra una cadena, no hay asignación de valor</p>" );       
         document.writeln( "<li>window.alert(\"a = 5\");</li>" );
         document.writeln( "<p class = 'respuesta'>Solo se muestra una cadena, no hay asignación de valor</p>" );        
         document.writeln( "<li>cadenaVal = window.prompt(\" Escriba una cadena:\" );</li>" );  
         document.writeln( "<p class = 'respuesta'>Se asigna a la variable cadenaVal <em>la cadena que se escriba por el teclado.</em></p></ol>" );
    </script>
