      <meta charset="utf-8">
      <title>Ejercicio de autoevaluación 6.4</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
      <link rel="stylesheet" href="/Estilos/Botones.css">
      <link rel="stylesheet" href="/Estilos/EspaciosBlanco.css">
      <script>
         document.writeln( "<h1>Ejercicio de Autoevaluación 6.4</h1>")         
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li><code>if ( c &lt; 7 );<br>&nbsp;&nbsp;&nbsp;window.alert( \"c es menor que 7\" );</code><p class='respuesta'>Error: no debe haber un punto y coma después del paréntesis derecho de la condición en la instrucción <code>if</code>. Corrección: elimine el punto y coma después del paréntesis derecho. [Nota: el resultado de este error es que la instrucción de salida se ejecuta sin importar que la condición en la instrucción <code>if</code> sea verdadera o no. El punto y coma después del paréntesis derecho se considera una instrucción vacía: una instrucción que no hace nada].</li>" );
         document.writeln( "<li><code>if ( c =&gt; 7 )<br>&nbsp;&nbsp;&nbsp;window.alert( \"c es igual o mayor que 7\" );</code><p class='respuesta'>Error: el operador relacional <code>=&gt;</code> es incorrecto. Corrección: cambie <code>=&gt;</code> por <code>&gt;=</code>.</li>" );
         document.writeln( "</ol>" );
      </script>
   </head>
