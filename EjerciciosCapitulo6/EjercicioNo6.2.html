            <script>
         <!-- la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación-->
         document.writeln( "<h1>Ejercicio de Autoevaluación 6.2</h1>")
         document.writeln( "<p>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Los comentarios hacen que la computadora imprima el texto después de los caracteres <code>//</code> en la pantalla al momento de ejecutar la secuencia de comandos.<p class='respuesta'>Falso. Los comentarios no provocan que se realice ninguna acción al ejecutar la secuencia de comandos. Se utilizan para documentar secuencias de comandos y mejorar su legibilidad.</li>" );
         document.writeln( "<li>JavaScript considera que las variables <code>numero</code> y <code>NuMeRo</code> son idénticas.<p class='respuesta'>Falso. JavaScript es susceptible al uso de mayúsculas, por lo que estas variables son distintas.</li>" );
         document.writeln( "<li>El operador residuo (<code>%</code>) puede usarse sólo con operandos numéricos.<p class='respuesta'>Verdadero.</li>" );
         document.writeln( "<li>Los operadores aritméticos <code>*</code>, <code>/</code>, <code>%</code>, <code>+</code> y <code>-</code> tienen todos el mismo nivel de precedencia.<p class='respuesta'>Falso. Los operadores <code>*</code>, <code>/</code> y <code>%</code> están en el mismo nivel de precedencia; los operadores <code>+</code> y <code>-</code> están en un nivel menor de precedencia.</li>" );
         document.writeln( "<li>El método <code>parseInt</code> convierte un entero en una cadena.<p class='respuesta'>Falso. La función <code>parseInt</code> convierte una cadena en un valor entero.</li>" );
         document.writeln( "</ol>" );
      </script>
