    <title>Ejercicio 6.13: Expresiones correctas para una ecuación</title>
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
    <link rel="stylesheet" href="/Estilos/Imagenes.css">
    <script>
         // Mostra resultados
         document.writeln( "<h1>Ejercicio 6.13: Expresiones correctas para una ecuación</h1>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Dada y = ax^3 + 7 ¿Cuáles de las siguientes instrucciones de JavaScript son correctas para esta ecuaciónS?</p>" );
         document.writeln( "<hr>" );
         document.writeln("<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>");               
         document.writeln( "<ol type = 'a'> <li>y = a * x * x * x + 7; </li>");
         document.writeln( "<p class = 'respuesta'>Si es correcta. 	ax³ + 7</p>" );         
         document.writeln( "<li>y = a * x * x * (x + 7);</li>" );    
         document.writeln( "<p class = 'respuesta'>No es correcta. Resultado: ax²(x + 7) = ax³ + 7ax²</p>" );       
         document.writeln( "<li>y = (a * x) * x * (x + 7)</li>" );
         document.writeln( "<p class = 'respuesta'>No es correcta. Resultado: ax · x · (x + 7) = ax³ + 7ax² </p>" );        
         document.writeln( "<li>y = (a * x) * x * x + 7; </li>" );
         document.writeln( "<p class = 'respuesta'>Si es correcta. Resultado: (ax) · x · x + 7 = ax³ + 7</p>" );
         document.writeln( "<li>y = a * (x*x*x) + 7; </li>" );  
         document.writeln( "<p class = 'respuesta'>Si es correcta. Resultado: a(x³) + 7 = ax³ + 7</p>" );
         document.writeln( "<li>y = a * x * (x * x + 7); </li>" );  
         document.writeln( "<p class = 'respuesta'>No es correcto. Resultado: ax(x² + 7) = ax³ + 7ax</p>" );
    </script>
