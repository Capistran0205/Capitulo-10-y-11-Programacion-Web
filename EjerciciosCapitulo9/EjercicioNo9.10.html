    <title>Ejercicio 9.10: Preguntas sobre números aleatorios</title>
    <script>
        document.writeln("<h2> Ejercicio 9.10: Preguntas sobre números aleatorios </h2>");
        document.writeln("<hr>");
        document.writeln("<p>Responda a cada una de las siguientes preguntas:</p>");
        document.writeln("<hr>Pasa el cursor por encima del espacio en blanco</hr>");
        document.writeln("<ol type = 'a'>");
        document.writeln("<li>¿Qué significa elegir números \"al azar\"?</li>");
        document.writeln("<p>Respuesta: <span class = 'respuesta'>Significa que cada valor posible tiene la misma probabilidad de ser elegido y que cada elección es independiente de las anteriores, de modo que no se puede predecir el siguiente a partir del historial</span>.</p>");
        document.writeln("<li>¿Por qué es útil Math.random para simular juegos de probabilidad? </li>");
        document.writeln("<p>Respuesta: <span class = 'respuesta'>Porque produce valores con probabilidad uniforme en el rango de 0.0 a 1.0 (sin llegar a 1.0). Escalados y desplazados, representan el resultado de un dado, una moneda, una carta o una ruleta, que es justamente el elemento de azar de esos juegos</span>.</p>");
        document.writeln("<li>¿Por qué es a menudo necesario escalar y/o desplazar los valores producidos por Math.random?</li>");
        document.writeln("<p>Respuesta: <span class = 'respuesta'>Porque Math.random siempre da valores entre 0.0 y 1.0, y cada aplicación necesita su propio rango. Un dado necesita enteros del 1 al 6, una moneda 0 o 1, y así sucesivamente. Se escala para fijar la amplitud del rango y se desplaza para fijar dónde empieza</span>.</p>");
        document.writeln("<li>¿Por qué es la simulación computarizada de situaciones reales una técnica útil?</li>");
        document.writeln("<p>Respuesta: <span class = 'respuesta'>Porque permite estudiar el comportamiento de un sistema sin los costos, riesgos ni el tiempo del experimento real. En segundos se pueden repetir miles de casos</span>.</p>");
        document.writeln("</ol>");

    </script>
