<!DOCTYPE html>
<!-- Ejercicio 9.24: multiplicarEvaluado.html -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <title>Ejercicio 9.24: Aprender a Multiplicar con Evaluaci&oacute;n</title>
    <script>
        document.writeln("<h1>Ejercicio 9.24: CAI con respuestas variadas</h1>");
        document.writeln("<hr>");
        document.writeln("<p>modifica el 9.23 para contar las respuestas correctas e incorrectas. Cuando el estudiante haya respondido 10 preguntas, calcula el porcentaje de respuestas correctas."+
            " Si es menor del 75 %, muestra \"Pida ayuda adicional a su instructor\" y reinicia el cuestionario para que otro estudiante pueda intentarlo.</p>",
        );
        document.writeln("<hr>");
        document.writeln("<h2>Solución:</h2>");
        var numero1;
        var numero2;
        var correctas = 0;   // respuestas correctas del cuestionario actual
        var incorrectas = 0; // respuestas incorrectas del cuestionario actual

        function iniciar() {
            var boton = document.getElementById("botonVerificar");
            boton.addEventListener("click", verificarRespuesta, false);
            generarPregunta();
        } // fin de la función iniciar

        function generarPregunta() {
            var campo = document.getElementById("campoRespuesta");

            numero1 = Math.floor(1 + Math.random() * 9);
            numero2 = Math.floor(1 + Math.random() * 9);

            document.getElementById("pregunta").innerHTML =
                "&iquest;Cu&aacute;nto es " + numero1 + " por " + numero2 + "?";
            campo.value = "";
            campo.focus();
        } // fin de la función generarPregunta

        function verificarRespuesta() {
            var campo = document.getElementById("campoRespuesta");
            var respuesta = parseInt(campo.value);
            var mensaje = document.getElementById("mensaje");
            var texto;

            if (isNaN(respuesta)) {
                mensaje.innerHTML = "Escriba un n&uacute;mero.";
                return; // no cuenta como respuesta
            } // fin de if

            if (respuesta === numero1 * numero2) {
                ++correctas;
                texto = respuestaCorrecta();
                generarPregunta();
            } // fin de if
            else {
                ++incorrectas;
                texto = respuestaIncorrecta();
                campo.value = "";
                campo.focus();
            } // fin de else

            // al llegar a 10 respuestas se evalúa el cuestionario
            if (correctas + incorrectas === 10)
                texto += "<br>" + evaluarCuestionario();

            mensaje.innerHTML = texto;
        } // fin de la función verificarRespuesta

        function evaluarCuestionario() {
            var porcentaje = correctas * 100 / 10;
            var resumen = "Respuestas correctas: " + correctas + " de 10 (" +
                porcentaje + "%). ";

            if (porcentaje < 75)
                resumen += "Pida ayuda adicional a su instructor.";
            else
                resumen += "&iexcl;Buen resultado!";

            correctas = 0;   // reinicia el cuestionario
            incorrectas = 0;
            generarPregunta(); // pregunta nueva para el siguiente estudiante

            return resumen;
        } // fin de la función evaluarCuestionario

        function respuestaCorrecta() {
            switch (Math.floor(1 + Math.random() * 4)) {
                case 1:
                    return "&iexcl;Muy bien!";
                case 2:
                    return "Excelente.";
                case 3:
                    return "Buen trabajo.";
                default:
                    return "Siga as&iacute;.";
            } // fin de switch
        } // fin de la función respuestaCorrecta

        function respuestaIncorrecta() {
            switch (Math.floor(1 + Math.random() * 4)) {
                case 1:
                    return "No. Intente de nuevo.";
                case 2:
                    return "Equivocado. Trate una vez m&aacute;s.";
                case 3:
                    return "No se d&eacute; por vencido.";
                default:
                    return "No. Siga intentando.";
            } // fin de switch
        } // fin de la función respuestaIncorrecta

        window.addEventListener("load", iniciar, false);
    </script>
</head>

<body>
    <form action="#">
        <p id="pregunta"></p>
        <p><input id="campoRespuesta" type="text" size="6">
            <input id="botonVerificar" type="button" value="Verificar">
        </p>
    </form>
    <p id="mensaje"></p>
    <nav>
        <a class="boton" href="Index_Ejercicios.html">Men&uacute; principal</a>
        <a class="boton" href="EjercicioNo9.23.html">&larr;Anterior</a>
        <a class="boton" href="EjercicioNo9.25.html">Siguiente&rarr;</a>
    </nav>
</body>

</html>
