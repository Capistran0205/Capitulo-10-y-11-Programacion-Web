<!DOCTYPE html>
<!-- Ejercicio 9.22: tablaMultiplicar.html -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <title>Ejercicio 9.22: Multiplicaciones</title>
    <script>
        document.writeln("<h1>Ejercicio 9.22: Multiplicaciones</h1>");
        document.writeln("<hr>");
        document.writeln("<p>Escriba un programa que ayude a un estudiante de primaria para que aprenda a multiplicar. Use Math.random para producir dos números enteros positivos de un dígito.</p>",);
        document.writeln("<hr>");
        document.writeln("<h2>Solución:</h2>");
        var numero1; // primer factor de la pregunta actual
        var numero2; // segundo factor de la pregunta actual

        function iniciar() {
            var boton = document.getElementById("botonVerificar");
            boton.addEventListener("click", verificarRespuesta, false);
            generarPregunta(); // primera pregunta al cargar la página
        } // fin de la función iniciar

        // genera una pregunta nueva con dos enteros positivos de un dígito
        function generarPregunta() {
            var campo = document.getElementById("campoRespuesta");

            numero1 = Math.floor(1 + Math.random() * 9);
            numero2 = Math.floor(1 + Math.random() * 9);

            document.getElementById("pregunta").innerHTML =
                "&iquest;Cu&aacute;nto es " + numero1 + " por " + numero2 + "?";
            campo.value = "";
            campo.focus();
        } // fin de la función generarPregunta

        function verificarRespuesta() {
            var campo = document.getElementById("campoRespuesta");
            var respuesta = parseInt(campo.value);
            var mensaje = document.getElementById("mensaje");

            if (isNaN(respuesta))
                mensaje.innerHTML = "Escriba un n&uacute;mero.";
            else if (respuesta === numero1 * numero2) {
                mensaje.innerHTML = "Muy bien";
                generarPregunta(); // pregunta nueva sólo cuando acierta
            } // fin de else if
            else {
                mensaje.innerHTML = "No. Intente de nuevo.";
                campo.value = ""; // misma pregunta, otro intento
                campo.focus();
            } // fin de else
        } // fin de la función verificarRespuesta

        window.addEventListener("load", iniciar, false);
    </script>
</head>

<body>
    <form action="#">
        <p id="pregunta"></p>
        <p><input id="campoRespuesta" type="text" size="6">
            <input id="botonVerificar" type="button" value="Verificar">
        </p>
    </form>
    <p id = "mensaje"></p>
    <nav>
        <a class="boton" href="Index_Ejercicios.html">Men&uacute; principal</a>
        <a class="boton" href="EjercicioNo9.21.html">&larr;Anterior</a>
        <a class="boton" href="EjercicioNo9.23.html">Siguiente&rarr;</a>
    </nav>
</body>

</html>
