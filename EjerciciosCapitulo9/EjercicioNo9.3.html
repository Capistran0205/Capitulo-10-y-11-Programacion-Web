      <script>
         <!-- la etiqueta <code> se usa para marcar semánticamente fragmentos de código de programación-->
         document.writeln( "<h1>Ejercicio de Autoevaluación 9.3</h1>")
         document.writeln( "<hr>" );
         document.writeln( "<p>Complete las siguientes oraciones.</p>" );
         document.writeln( "<hr>" );
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Las funciones definidas por el programador, las variables globales y las funciones globales de JavaScript son todas partes del objeto <span class = 'respuesta'> Global</span>.</li>" );
         document.writeln( "<li>La función <span class = 'respuesta'>isNaN</span> determina si su argumento es un número o no.</li>" );
         document.writeln( "<li>La función <span class = 'respuesta'>escape</span> recibe un argumento de cadena y devuelve una cadena en la que todos los espacios, puntuación, caracteres de acentuación y cualquier otro carácter que no esté en el conjunto  de caracteres ASCII se codifican en un formato hexadecimal.</li>" );
         document.writeln( "<li>La función <span class = 'respuesta'>eval</span> recibe un argumento de cadena que representa el código de JavaScript a ejecutar.</li>" );
         document.writeln( "<li>La función <span class = 'respuesta'>unescape</span> recibe una cadena como su argumento y devuelve una cadena en donde se decodifican todos los caracteres que se codificaron antes con escape.</li>" );
         document.writeln( "</ol>" );
      </script>
