<!DOCTYPE html>

<!-- Fig. 7.14: incremento.html -->
<!-- Preincremento y postincremento. -->
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/Estilos/Botones.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 7.14: Preincremento y postincremento</title>
    <script>
        document.writeln( "<h1>Ejemplo 7.14: Preincremento y postincremento</h1>" );
        var c;

        c = 5;
        document.writeln("<h3>Postincremento</h3>");
        document.writeln("<p>" + c); // imprime 5
        // imprime 5 y luego incrementa
        document.writeln(" " + c++);
        document.writeln(" " + c + "</p>"); // imprime 6

        c = 5;
        document.writeln("<h3>Preincremento</h3>");
        document.writeln("<p>" + c); // imprime 5
        // incrementa y luego imprime 6
        document.writeln(" " + ++c);
        document.writeln(" " + c + "</p>"); // imprime 6

    </script>
</head>

<body>

        <a class="boton" href="Index_Ejemplos.html".html">Men&uacute; principal</a>
        <a class="boton" href="EjemploNo7.11.html">&larr;Anterior</a>
    </nav>
</body>

</html>
